<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyusic Player</title>
    <link rel="stylesheet" href="nyusic.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Gochi+Hand&display=swap" rel="stylesheet">
</head>
<body>
    <div id="name"><h1>Nyusic Player</h1></div>
    <div id="mainbod">
        <div class="player">
            <div class="albcover">

            </div>
            <div class="controls">
                <div class="btns">
                    <audio id="myAudio" src="./audios/Hate You.mp3"></audio>    
                    <!-- <button id="pauseBtn">Pause</button> -->
                    <button id="prevBtn"><img src="./imgs/prev.svg" title="Previous"></button>
                    <button id="playBtn"><img src="./imgs/button-play.svg" title="Play"></button>
                    <button id="nextBtn"><img src="./imgs/next.svg" title="Next"></button>
                    <!-- <button id="stopBtn">Stop</button> -->
                </div>
                
            </div>
        </div>

    </div>
</body>
</html>
<script src="nyusic.js"></script>
